<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard Integrity Engine</title>
    <script>
      // This app themes dark, so the whole template set stays visually
      // consistent. Set the `dark` class before first paint so the page never
      // flashes light. Keep this inline and above the stylesheet.
      (function () {
        try {
          document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
